[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nlp-text-classifier"
version = "0.1.0"
description = "Research slice: TF-IDF baseline vs tiny from-scratch TransformerEncoder on frozen 20 Newsgroups split."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "M.Varun" }]
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "torch",
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
